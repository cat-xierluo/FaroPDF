# FaroPDF doc-curator 配置
# 由 .claude/skills/doc-curator/scripts/scan.sh 读取。
# 阈值分为三类：硬性（必须通过）、自适应（首跑基线 × 1.5）、软提示（只报告不阻断）。

# 监控文件清单（相对仓库根）
files:
  - path: docs/TASKS.md
    role: active-tasks
  - path: docs/DECISIONS.md
    role: decision-log
  - path: docs/ROADMAP.md
    role: roadmap
  - path: docs/DESIGN.md
    role: design
  - path: docs/ARCHITECTURE.md
    role: architecture
  - path: CHANGELOG.md
    role: changelog
  - path: README.md
    role: readme
  - path: AGENTS.md
    role: agent-guide

# 硬性规则：不通过则必须提 maintenance PR
hard_rules:
  - id: tasks-progress-log-trim
    file: docs/TASKS.md
    description: "进度日志条目数 ≤ 5"
    severity: error
  - id: decisions-iss-archive-ascending
    file: docs/DECISIONS.md
    description: "ISS 任务归档条目按 ISS 编号升序排列"
    severity: error
  - id: decisions-dec-numbering-continuous
    file: docs/DECISIONS.md
    description: "DEC-XXX 编号连续无跳号"
    severity: error
  - id: tasks-archived-iss-pointer
    file: docs/TASKS.md
    description: "归档任务索引必须指向 DECISIONS.md 归档区"
    severity: error

# 自适应规则：首跑后用 state.json 的 baseline × 1.5 作为阈值
# multiplier 默认 1.5，可在 state.json 调整
adaptive_rules:
  - id: tasks-active-count
    file: docs/TASKS.md
    metric: active_task_count
    description: "活跃任务卡数量"
    seed_value: 3
    multiplier: 1.5
  - id: files-line-count
    file: docs/TASKS.md
    metric: line_count
    description: "总行数"
    seed_value: 139
    multiplier: 1.5
  - id: decisions-line-count
    file: docs/DECISIONS.md
    metric: line_count
    description: "总行数"
    seed_value: 453
    multiplier: 1.5
  - id: roadmap-line-count
    file: docs/ROADMAP.md
    metric: line_count
    description: "总行数"
    seed_value: 129
    multiplier: 1.5
  - id: design-line-count
    file: docs/DESIGN.md
    metric: line_count
    description: "总行数"
    seed_value: 192
    multiplier: 1.5
  - id: architecture-line-count
    file: docs/ARCHITECTURE.md
    metric: line_count
    description: "总行数"
    seed_value: 663
    multiplier: 1.5
  - id: agents-line-count
    file: AGENTS.md
    metric: line_count
    description: "总行数"
    seed_value: 101
    multiplier: 1.5

# 软提示：仅报告不阻断
soft_rules:
  - id: changelog-recent-release-entry
    file: CHANGELOG.md
    description: "CHANGELOG.md 应有最近一次 release 的 entry"
  - id: readme-current-status
    file: README.md
    description: "README.md 「当前状态」段存在"
