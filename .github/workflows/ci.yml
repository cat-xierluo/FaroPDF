name: CI

# 拦截前端 typecheck / lint / test / build 回归，确保 PR 合入前测试套件
# 处于绿态。push 与 PR 都触发；仅跑 pnpm 链路，不编译 Tauri（避免 macOS
# WKWebView / Windows WiX 的 release-only 依赖；Tauri 构建由 release.yml 负责）。
#
# 参照 Folia ci.yml，但去掉 Folia 的 @rolldown/binding / lightningcss 平台
# 二进制 hack：FaroPDF 用 vite 7 + 标准 vitest 4，无原生二进制问题。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 显式最小权限：只读仓库内容。
permissions:
  contents: read

# 同一分支 / PR 上一次只跑一个，cancel 旧的节省 runner 配额。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Vitest
        # 不加 --reporter=verbose：默认 reporter 输出更短、CI 日志更易扫读。
        run: pnpm test

      - name: Build
        # 不产出 artifact，只验证 vite build 可成功；防止 chunk 拆分 / 资源路径
        # 类回归溜进 main。
        run: pnpm run build
