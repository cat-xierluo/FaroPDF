name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

# ISS-021 跨平台打包 + 自动更新发布流水线（v0.1.1 Folia 对齐版）。
#
# 触发条件：推送形如 vX.Y.Z（stable）或 vX.Y.Z-prerelease（alpha / beta / rc）的 tag（带 v 前缀）。
#
# 流程（Folia 模板，对齐 tauri-apps/tauri-action@v0 + releaseDraft）：
#   1. build 矩阵（macos-aarch64 / macos-x64 / windows-x64）各自跑 tauri-action：
#      - macOS 拆 2 个独立 build（不再 universal）
#      - tauri-action 自动：pnpm install / cargo tauri build / 签 .sig 旁车 / 上传 draft release
#      - Windows 走 NSIS .exe（不发 .msi；与 Folia 一致）
#   2. publish job 拉 draft release 的 *.sig → 跑 `pnpm run updater:manifest` 拼 latest.json →
#      上传 latest.json → --draft=false 公开。
#      若 updater 四件套（createUpdaterArtifacts / updater.active / signing key / pubkey）
#      未齐备，build 不产 *.sig，publish 跳过 latest.json 生成但仍公开 release。
#
# 关键环境变量（GitHub Secrets）：
#   - TAURI_SIGNING_PRIVATE_KEY          tauri signer generate 输出的私钥文件原文（一层 base64）
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD 私钥密码
#   - GITHUB_TOKEN                       默认提供，用于创建 / 公开 release
#
# 关联：DEC-070（v0.1.0 4 轮 CI 修复复盘）/ DEC-071（v0.1.1 Folia 对齐设计）。

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workdir: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FaroPDF ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # includeUpdaterJson 必须 true：让 tauri-action 在所有 updater 启用的
          # 平台（macos-aarch64/x64 / windows-x64）生成 + 上传 .app.tar.gz /
          # .nsis.zip + 对应 .sig，并生成 latest.json。设 false 会导致 macOS
          # runner 没生成 .app.tar.gz.sig，publish job 报
          # "Missing updater signatures for required platforms"（对齐 Folia v0.4.0 修复）。
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    # publish job 负责：拉 build job 上传的 *.sig → 拼 latest.json（updater manifest）
    # → 上传 latest.json → 把 release 草稿公开。
    #
    # updater 自动更新闭环需要：createUpdaterArtifacts: true + updater.active: true
    # + TAURI_SIGNING_PRIVATE_KEY secret + tauri.conf.json pubkey 四件套齐备。
    # 任一缺失时，build job 不会产 *.sig，下方 SIGS_FOUND 判空会跳过 latest.json
    # 生成并仍把 release 公开（用户可手动下载，只是无法应用内自动更新）。
    # 四件套齐备后 latest.json 才会真正生成，updater 才闭环。
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate latest.json (or skip if no signatures yet)
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          REPO="${{ github.repository }}"

          mkdir -p sigs
          # build job 在 updater 四件套未齐备时不会产 *.sig，gh release download
          # 会以非零退出码失败；用 || true 容错，后面按 sigs 目录是否为空分支。
          gh release download "$TAG" --repo "$REPO" --pattern "*.sig" --dir sigs || true

          SIG_COUNT=$(find sigs -type f -name '*.sig' | wc -l | tr -d ' ')
          echo "Found ${SIG_COUNT} signature file(s)"

          if [ "$SIG_COUNT" -eq 0 ]; then
            echo "no-sigs=true" >> "$GITHUB_OUTPUT"
            echo " updater 四件套未齐备（createUpdaterArtifacts / updater.active / signing key / pubkey），"
            echo "跳过 latest.json 生成；release 仍会公开供手动下载。"
            exit 0
          fi

          FAROPDF_SIGNATURE_DIR=sigs \
          FAROPDF_UPDATE_VERSION="$VERSION" \
          FAROPDF_UPDATE_TAG="$TAG" \
          FAROPDF_UPDATE_NOTES="FaroPDF $VERSION" \
          FAROPDF_UPDATE_REPO="https://github.com/$REPO" \
          FAROPDF_MANIFEST_OUTPUT=latest.json \
          FAROPDF_REQUIRE_PLATFORMS="darwin-aarch64,darwin-x86_64,windows-x86_64" \
          pnpm run updater:manifest

      - name: Show generated latest.json
        if: always() && steps.manifest.outputs.no-sigs != 'true'
        run: cat latest.json

      - name: Upload latest.json and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.manifest.outputs.no-sigs }}" != "true" ] && [ -f latest.json ]; then
            gh release upload "${{ github.ref_name }}" latest.json \
              --repo "${{ github.repository }}" --clobber
          else
            echo "Skipping latest.json upload (updater not fully configured)"
          fi
          gh release edit "${{ github.ref_name }}" \
            --draft=false --repo "${{ github.repository }}"

