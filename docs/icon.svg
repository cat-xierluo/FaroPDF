<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FaroPDF">
  <title>FaroPDF</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2940"/>
      <stop offset="100%" stop-color="#0F1B2D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFC847" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFC847" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: rounded square (app-icon style) -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Light halo -->
  <circle cx="128" cy="78" r="56" fill="url(#glow)"/>

  <!-- Light dome (cap) -->
  <path d="M 108 60 Q 128 48 148 60 L 148 66 L 108 66 Z" fill="#2C3E50"/>
  <rect x="108" y="64" width="40" height="4" fill="#1A2530"/>

  <!-- Light bulb -->
  <circle cx="128" cy="80" r="18" fill="#FFC847"/>
  <circle cx="124" cy="76" r="6" fill="#FFE4A0" opacity="0.8"/>

  <!-- Light gallery (railing around bulb) -->
  <rect x="106" y="98" width="44" height="6" fill="#2C3E50"/>

  <!-- Tower (trapezoid) -->
  <path d="M 116 104 L 140 104 L 150 196 L 106 196 Z" fill="#F5F5F5"/>
  <path d="M 116 104 L 140 104 L 141 110 L 115 110 Z" fill="#D8D8D8"/>

  <!-- Red stripe (lighthouse band) -->
  <rect x="106" y="138" width="44" height="22" fill="#C73E3A"/>
  <rect x="106" y="138" width="44" height="4" fill="#A52E2A"/>
  <rect x="106" y="156" width="44" height="4" fill="#A52E2A"/>

  <!-- Window -->
  <rect x="122" y="118" width="12" height="14" rx="2" fill="#0F1B2D"/>
  <rect x="124" y="120" width="3" height="10" fill="#FFC847" opacity="0.4"/>

  <!-- Base / foundation -->
  <rect x="96" y="196" width="64" height="14" fill="#2C3E50"/>
  <rect x="96" y="196" width="64" height="4" fill="#1A2530"/>
  <rect x="84" y="210" width="88" height="6" fill="#1A2530"/>

  <!-- Subtle "F" watermark (low opacity, optional) -->
  <text x="200" y="244" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" opacity="0.18">FaroPDF</text>
</svg>
